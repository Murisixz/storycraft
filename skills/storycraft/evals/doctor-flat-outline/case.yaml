schema_version: "1.1"
name: doctor-flat-outline
expected_outcome: |
  A diagnosis that identifies the outline's 'and then' event chain, the protagonist's lack of a goal/agency, the coincidences doing the plot's work (photo, letter in lost-and-found), and the unprepared reveal; followed by a revised outline in which beats are causally linked, the protagonist's choices drive events, the father connection is planted early, and the ending lands through recognition and a meaningful change.
