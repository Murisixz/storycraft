schema_version: "1.1"
name: fair-play-whodunit-outline
expected_outcome: |
  A fair-play murder mystery plan: the true hidden chronology of the crime, suspects with motive/means/opportunity and their own secrets, a clue ledger (where each clue appears, how it is disguised, what it proves), red herrings with innocent explanations, a reveal order across the book, a killer with an emotionally heartbreaking motive, and a fairness check that all solution-critical clues appear before the solution.
